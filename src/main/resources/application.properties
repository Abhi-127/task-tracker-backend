spring.config.import=optional:classpath:application-local.properties
spring.application.name=task-tracker-backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/task_tracker_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:your_postgres_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:TaskTrackerSuperSecretKeyForJwtSigning2026MustBeLongEnough}
jwt.expiration-ms=86400000
